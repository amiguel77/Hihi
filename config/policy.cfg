[authorization]
revision=0x0042A91C
protocol=HOST_CONTEXT_V3
integrity=REQUIRED
confirmation=REQUIRED
override=ENABLED

[operation]
target=WINDOWS_OS
scope=SYSTEM_VOLUME
mode=EXCLUSIVE
recursive=TRUE
dependency_resolution=STRICT
filesystem_validation=REQUIRED

[host]
binding=PROCESS_CONTEXT
ownership=REQUIRED
integrity_boundary=LOCKED
protected_context=ENABLED

[security]
token_validation=REQUIRED
policy_validation=REQUIRED
signature_validation=REQUIRED
privilege_boundary=SYSTEM
unauthorized_io=BLOCK

[recovery]
rollback=DISABLED
transactional=TRUE
commit_threshold=100
failure_action=ABORT